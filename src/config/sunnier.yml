# Sunnier weather: more clear skies, less fog and rain.
#
# Multipliers are applied to every region's vanilla BlendWeight (see vanilla.yml),
# so this variant follows the game's own balance when it changes in a patch.

multipliers:
  Clearly: 1.5
  Cloudy: 0.85
  Fogy: 0.5
  Stormy: 1.0
  LightRainy: 0.75
  Rainy: 0.75

round_to: 1

# Special weather left at vanilla values. Regions with a 100% chance for a single
# weather type are always left at vanilla values too.
exclude:
  - Gradirni_FireBreath_WeatherSelection  # The Fire Whirl arch anomaly
  - VortexWeatherSelection                # The Tornado arch anomaly
  - SQ10_NoEmission_Weather               # Side quest Shift Change
  - Empty                                 # Root template for all weather selections

# Exact values, applied after the multipliers
overrides: {}
