name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REPAK_VERSION: v0.2.3
  REPAK_SHA256: 933bdb8e26f34e8fd70ea50201efca39df041de58aa83b1cd6eb83da124a2046

jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7

      # Every variant in src/config except vanilla.yml, as a JSON list of names
      - id: list
        run: |
          names=$(ls src/config/*.yml | xargs -n1 basename -s .yml | grep -vx vanilla | jq -Rnc '[inputs]')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  pak:
    needs: variants
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.names) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Install repak
        run: |
          archive=repak_cli-x86_64-unknown-linux-gnu.tar.xz
          curl -sSLO "https://github.com/trumank/repak/releases/download/$REPAK_VERSION/$archive"
          echo "$REPAK_SHA256  $archive" | sha256sum -c -
          tar xJf "$archive"
          mkdir -p "$HOME/.local/bin"
          mv repak_cli-x86_64-unknown-linux-gnu/repak "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package ${{ matrix.variant }} variant
        run: ./package.sh "${{ matrix.variant }}.yml"

      - uses: actions/upload-artifact@v7
        with:
          name: better-weather-${{ matrix.variant }}
          path: dist/better-weather-${{ matrix.variant }}.pak
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: better-weather-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pak --repo "$GITHUB_REPOSITORY" --generate-notes
